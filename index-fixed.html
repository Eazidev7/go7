<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="./go7-logo.png" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./go7-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- PWA Support -->
  <link rel="manifest" href="./manifest.json" />
  
  <!-- Force browser to always fetch fresh content (no caching) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="cache-buster" content="v7.MAIN-HOMEPAGE-LOAD.2025.10.22.FIXED" />
  
  <!-- Load React from CDN first - guaranteed to work -->
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  
  <!-- Fallback React loader in case CDN fails -->
  <script src="/react-loader.js"></script>
  
  <!-- Fix for storage issues -->
  <script src="/storage-fix.js"></script>
  
  <title>Go7 Application</title>
  
  <style>
    /* Critical CSS to ensure basic styling while app loads */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f5f5f5;
    }
    
    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    
    .loading img {
      max-width: 120px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <img src="./go7-logo.png" alt="Go7 Logo" />
      <h2>Loading Go7 Application...</h2>
      <p>Please wait while we initialize the application.</p>
    </div>
  </div>
  
  <!-- React mount diagnostic -->
  <script src="/react-mount-diagnostic.js"></script>
  
  <!-- Main application script -->
  <script type="module" src="/src/main.jsx"></script>
  
  <!-- Mobile detection helper -->
  <script src="/test-mobile-detection.js"></script>
  
  <script>
    // Check React loading status
    window.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded, checking React status...');
      
      if (window.React && window.ReactDOM) {
        console.log('React is properly loaded:', window.React.version);
      } else {
        console.warn('React not detected in global scope - waiting for react-loader...');
      }
    });
  </script>
</body>
</html>
