<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Vendor Password - GO7</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    button:hover {
      transform: translateY(-2px);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .message {
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 14px;
    }
    
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      margin-bottom: 20px;
    }
    
    .vendors-list {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      max-height: 300px;
      overflow-y: auto;
    }
    
    .vendor-item {
      padding: 12px;
      background: white;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    
    .vendor-item:hover {
      border-color: #667eea;
      transform: translateX(5px);
    }
    
    .vendor-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }
    
    .vendor-email {
      color: #667eea;
      font-size: 14px;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Reset Vendor Password</h1>
    <p class="subtitle">Select a vendor or enter email to send password reset link</p>
    
    <div class="info">
      ℹ️ <strong>Note:</strong> Passwords are hashed and cannot be retrieved. This tool sends a password reset email.
    </div>
    
    <div id="vendorsList" class="vendors-list">
      <div class="loading">
        <div class="spinner"></div>
        Loading vendors...
      </div>
    </div>
    
    <div class="input-group">
      <label for="email">Vendor Email Address</label>
      <input 
        type="email" 
        id="email" 
        placeholder="vendor@example.com"
        required
      />
    </div>
    
    <button id="resetBtn" onclick="resetPassword()">
      Send Password Reset Email
    </button>
    
    <div id="message"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDiUnq9vlXkp5űBNTyLVFWe3Kq_B0v21M8",
      authDomain: "go7-32084.firebaseapp.com",
      projectId: "go7-32084",
      storageBucket: "go7-32084.firebasestorage.app",
      messagingSenderId: "201718584347",
      appId: "1:201718584347:web:b78d9a83ff03e01afaca9c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Load vendors
    async function loadVendors() {
      try {
        const vendorsRef = collection(db, 'vendors');
        const snapshot = await getDocs(vendorsRef);
        
        const vendorsList = document.getElementById('vendorsList');
        
        if (snapshot.empty) {
          vendorsList.innerHTML = '<div class="loading">No vendors found</div>';
          return;
        }
        
        vendorsList.innerHTML = '';
        
        snapshot.forEach((doc) => {
          const data = doc.data();
          const email = data.email || data.ownerEmail;
          const name = data.name || data.businessName || 'Unknown Business';
          
          if (email) {
            const vendorItem = document.createElement('div');
            vendorItem.className = 'vendor-item';
            vendorItem.innerHTML = `
              <div class="vendor-name">${name}</div>
              <div class="vendor-email">${email}</div>
            `;
            vendorItem.onclick = () => {
              document.getElementById('email').value = email;
            };
            vendorsList.appendChild(vendorItem);
          }
        });
        
      } catch (error) {
        console.error('Error loading vendors:', error);
        document.getElementById('vendorsList').innerHTML = 
          '<div class="loading" style="color: red;">Error loading vendors</div>';
      }
    }

    // Reset password function
    window.resetPassword = async function() {
      const email = document.getElementById('email').value.trim();
      const messageDiv = document.getElementById('message');
      const resetBtn = document.getElementById('resetBtn');
      
      if (!email) {
        messageDiv.innerHTML = '<div class="message error">Please enter an email address</div>';
        return;
      }
      
      resetBtn.disabled = true;
      resetBtn.textContent = 'Sending...';
      messageDiv.innerHTML = '';
      
      try {
        await sendPasswordResetEmail(auth, email);
        
        messageDiv.innerHTML = `
          <div class="message success">
            ✅ <strong>Password reset email sent!</strong><br/>
            Check the inbox for <strong>${email}</strong><br/>
            The email contains a link to reset the password.
          </div>
        `;
        
      } catch (error) {
        console.error('Error:', error);
        
        let errorMessage = 'Failed to send reset email';
        
        if (error.code === 'auth/user-not-found') {
          errorMessage = 'No account found with this email address';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'Invalid email address format';
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = 'Too many requests. Please try again later';
        }
        
        messageDiv.innerHTML = `
          <div class="message error">
            ❌ <strong>Error:</strong> ${errorMessage}
          </div>
        `;
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = 'Send Password Reset Email';
      }
    };

    // Load vendors on page load
    loadVendors();
  </script>
</body>
</html>
