<!DOCTYPE html>
<html>
<head>
    <title>Credit Payment - Go7</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBmQwPSnQslo6Sq4NeYjAUi8iaZIYVlaBg",
            authDomain: "go7-delivery.firebaseapp.com",
            projectId: "go7-delivery",
            storageBucket: "go7-delivery.firebasestorage.app",
            messagingSenderId: "232009015458",
            appId: "1:232009015458:web:49dbb63a5a67112325f7fb"
        };

        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app);

        window.creditPayment = async function() {
            const btn = document.getElementById('creditBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Processing...';

            try {
                const backfillPayment = httpsCallable(functions, 'backfillPayment');
                const result = await backfillPayment({
                    reference: '100033251031113406958333210106',
                    userId: 'M8Gol8PxRJbvhVincONS8FJRdFE3'
                });

                if (result.data.success) {
                    document.getElementById('result').innerHTML = `
                        <div style="color: #4caf50; padding: 20px; border: 2px solid #4caf50; border-radius: 8px;">
                            <h2>✅ Payment Credited Successfully!</h2>
                            <p>Amount: ₦${result.data.amount}</p>
                            <p>Reference: ${result.data.reference}</p>
                            <p>User: ${result.data.email}</p>
                            <br>
                            <p><strong>Refresh your Go7 app to see the updated balance!</strong></p>
                        </div>
                    `;
                } else {
                    throw new Error(result.data.message || 'Unknown error');
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `
                    <div style="color: #f44336; padding: 20px; border: 2px solid #f44336; border-radius: 8px;">
                        <h2>❌ Error</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '💰 Credit Payment';
            }
        };
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #e53935;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px 0;
        }
        button:hover:not(:disabled) {
            background: #d32f2f;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .info p {
            margin: 5px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Credit Missing Payment</h1>
        
        <div class="info">
            <p><strong>Amount:</strong> ₦300.00</p>
            <p><strong>Reference:</strong> 100033251031113406958333210106</p>
            <p><strong>User:</strong> M8Gol8PxRJbvhVincONS8FJRdFE3</p>
            <p><strong>Email:</strong> feyistantobiloba@gmail.com</p>
        </div>

        <button id="creditBtn" onclick="creditPayment()">
            💰 Credit Payment
        </button>

        <div id="result"></div>
    </div>
</body>
</html>
