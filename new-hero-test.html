<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go7 Simple Hero Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #e53e3e; /* Go7 red theme */
      color: white;
      padding: 20px;
      border-radius: 5px;
      text-align: center;
    }
    .search-container {
      margin: 20px 0;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: none;
      font-size: 16px;
    }
    .chip-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    .chip {
      background-color: rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
    }
    .chip.selected {
      background-color: white;
      color: #e53e3e;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>From Burgers to Parcels, We Deliver Fast</h1>
    
    <div class="search-container">
      <input type="text" placeholder="Search for vendors or enter delivery address">
    </div>
    
    <div class="chip-container">
      <div class="chip selected">Food</div>
      <div class="chip">Grocery</div>
      <div class="chip">Pharmacy</div>
      <div class="chip">Parcels</div>
    </div>
  </div>

  <script>
    // Simple script to toggle chip selection
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
      });
    });
  </script>
</body>
</html>
