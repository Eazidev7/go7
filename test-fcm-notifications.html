<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCM Push Notifications Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            text-align: center;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 10px 10px 0;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 10px 0;
        }
        .result {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
        }
        label {
            display: block;
            font-weight: 600;
            margin: 15px 0 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔔 FCM Push Notifications Test</h1>
        
        <div id="status" class="status info">
            ⏳ Initializing FCM...
        </div>

        <div id="permission-section">
            <h3>1️⃣ Request Notification Permission</h3>
            <button onclick="requestPermission()">🔓 Request Permission</button>
            <div id="permission-result"></div>
        </div>

        <div id="token-section" style="display:none;">
            <h3>2️⃣ Get FCM Token</h3>
            <button onclick="getToken()">🔑 Generate Token</button>
            <div id="token-result"></div>
        </div>

        <div id="test-section" style="display:none;">
            <h3>3️⃣ Test Notification Functions</h3>
            
            <label>User ID (for testing):</label>
            <input type="text" id="userId" value="test-user-123">
            
            <label>FCM Token (saved above):</label>
            <input type="text" id="fcmToken" readonly>
            
            <button onclick="testOrderNotification()">🛒 Test New Order</button>
            <button onclick="testRiderNotification()">🏍️ Test Rider Assignment</button>
            <button onclick="testChatNotification()">💬 Test Chat Message</button>
            
            <div id="test-result"></div>
        </div>

        <div id="listen-section" style="display:none;">
            <h3>4️⃣ Listen for Notifications</h3>
            <div class="status info">
                📡 Listening for incoming notifications...
            </div>
            <div id="messages"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getMessaging, getToken, onMessage } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js';
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js';
        import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDVe4upj9TxE6YE0Oq5J8_3wVTOIlK6vw4",
            authDomain: "go7-delivery.firebaseapp.com",
            projectId: "go7-delivery",
            storageBucket: "go7-delivery.firebasestorage.app",
            messagingSenderId: "722285015876",
            appId: "1:722285015876:web:cc3f16636a0c9d06c1f7e6"
        };

        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app);
        const db = getFirestore(app);
        let messaging;

        // Try to initialize messaging
        try {
            messaging = getMessaging(app);
            document.getElementById('status').innerHTML = '<span class="status success">✅ FCM initialized successfully!</span>';
            document.getElementById('permission-section').style.display = 'block';
        } catch (error) {
            console.error('FCM init error:', error);
            document.getElementById('status').innerHTML = 
                '<span class="status warning">⚠️ FCM requires HTTPS. ' +
                'This test works in production or localhost with SSL. ' +
                'Functions are deployed and will work when conditions are met.</span>';
        }

        window.requestPermission = async function() {
            const resultDiv = document.getElementById('permission-result');
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    resultDiv.innerHTML = '<div class="status success">✅ Permission granted!</div>';
                    document.getElementById('token-section').style.display = 'block';
                } else {
                    resultDiv.innerHTML = '<div class="status error">❌ Permission denied</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<div class="status error">❌ Error: ' + error.message + '</div>';
            }
        };

        window.getToken = async function() {
            const resultDiv = document.getElementById('token-result');
            resultDiv.innerHTML = '⏳ Getting token...';
            
            try {
                // VAPID key would be needed in production
                const token = await getToken(messaging, {
                    vapidKey: 'YOUR_VAPID_KEY_HERE' // Add this in production
                });
                
                if (token) {
                    resultDiv.innerHTML = 
                        '<div class="status success">✅ Token generated!</div>' +
                        '<div class="result">' + token + '</div>';
                    document.getElementById('fcmToken').value = token;
                    document.getElementById('test-section').style.display = 'block';
                    document.getElementById('listen-section').style.display = 'block';
                    
                    // Listen for messages
                    onMessage(messaging, (payload) => {
                        console.log('Message received:', payload);
                        const messagesDiv = document.getElementById('messages');
                        messagesDiv.innerHTML += 
                            '<div class="result">' +
                            '<strong>📬 New Notification</strong><br>' +
                            '<strong>Title:</strong> ' + payload.notification?.title + '<br>' +
                            '<strong>Body:</strong> ' + payload.notification?.body + '<br>' +
                            '<strong>Data:</strong> ' + JSON.stringify(payload.data) +
                            '</div>';
                    });
                } else {
                    resultDiv.innerHTML = '<div class="status warning">⚠️ Token generation returned null. VAPID key needed.</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = 
                    '<div class="status error">❌ Error: ' + error.message + '</div>' +
                    '<div class="status info">ℹ️ Add VAPID key to .env file: VITE_FIREBASE_VAPID_KEY</div>';
            }
        };

        window.testOrderNotification = async function() {
            const resultDiv = document.getElementById('test-result');
            const userId = document.getElementById('userId').value;
            const fcmToken = document.getElementById('fcmToken').value;
            
            resultDiv.innerHTML = '⏳ Testing order notification...';
            
            try {
                // Save FCM token to user document
                await setDoc(doc(db, 'users', userId), {
                    fcmToken: fcmToken,
                    testUser: true
                }, { merge: true });
                
                // Create test order
                const orderId = 'TEST-' + Date.now();
                await setDoc(doc(db, 'orders', orderId), {
                    userId: userId,
                    orderNumber: orderId,
                    total: 5000,
                    items: [{ name: 'Test Item', quantity: 1, price: 5000 }],
                    status: 'pending',
                    createdAt: new Date()
                });
                
                resultDiv.innerHTML = 
                    '<div class="status success">✅ Test order created!</div>' +
                    '<div class="result">Order ID: ' + orderId + '<br>' +
                    'The notifyNewOrder function should trigger automatically.<br>' +
                    'Check the console and notification above.</div>';
            } catch (error) {
                resultDiv.innerHTML = '<div class="status error">❌ Error: ' + error.message + '</div>';
            }
        };

        window.testRiderNotification = async function() {
            const resultDiv = document.getElementById('test-result');
            const userId = document.getElementById('userId').value;
            
            resultDiv.innerHTML = '⏳ Testing rider notification...';
            
            try {
                // Create order then update with rider
                const orderId = 'TEST-RIDER-' + Date.now();
                const orderRef = doc(db, 'orders', orderId);
                
                // Create order first
                await setDoc(orderRef, {
                    userId: userId,
                    orderNumber: orderId,
                    total: 5000,
                    status: 'pending',
                    createdAt: new Date()
                });
                
                // Wait a bit then assign rider
                setTimeout(async () => {
                    await setDoc(orderRef, {
                        riderId: 'test-rider-123',
                        riderName: 'Test Rider',
                        status: 'assigned'
                    }, { merge: true });
                    
                    resultDiv.innerHTML = 
                        '<div class="status success">✅ Rider assigned!</div>' +
                        '<div class="result">Order: ' + orderId + '<br>' +
                        'Rider: Test Rider<br>' +
                        'The notifyRiderAssignment function should trigger.</div>';
                }, 2000);
                
                resultDiv.innerHTML = '<div class="status info">⏳ Creating order and assigning rider...</div>';
            } catch (error) {
                resultDiv.innerHTML = '<div class="status error">❌ Error: ' + error.message + '</div>';
            }
        };

        window.testChatNotification = async function() {
            const resultDiv = document.getElementById('test-result');
            const userId = document.getElementById('userId').value;
            
            resultDiv.innerHTML = '⏳ Testing chat notification...';
            
            try {
                const deliveryId = 'TEST-DELIVERY-' + Date.now();
                const messageId = 'MSG-' + Date.now();
                
                // Create chat message
                await setDoc(doc(db, `chats/${deliveryId}/messages/${messageId}`), {
                    senderId: 'rider-123',
                    receiverId: userId,
                    text: 'Test message from rider',
                    senderRole: 'rider',
                    senderName: 'Test Rider',
                    timestamp: new Date(),
                    read: false
                });
                
                resultDiv.innerHTML = 
                    '<div class="status success">✅ Chat message created!</div>' +
                    '<div class="result">Delivery: ' + deliveryId + '<br>' +
                    'Message: "Test message from rider"<br>' +
                    'The sendChatNotification function should trigger.</div>';
            } catch (error) {
                resultDiv.innerHTML = '<div class="status error">❌ Error: ' + error.message + '</div>';
            }
        };
    </script>
</body>
</html>
