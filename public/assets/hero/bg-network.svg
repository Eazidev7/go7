<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="network" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white" opacity="0.3"/>
      <circle cx="5" cy="5" r="0.5" fill="white" opacity="0.2"/>
      <circle cx="35" cy="10" r="0.5" fill="white" opacity="0.2"/>
