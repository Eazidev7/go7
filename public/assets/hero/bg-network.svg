      <line x1="20" y1="20" x2="35" y2="10" stroke="white" stroke-width="0.3" opacity="0.1"/>
      <line x1="20" y1="20" x2="10" y2="35" stroke="white" stroke-width="0.3" opacity="0.1"/>
