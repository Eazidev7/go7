<!DOCTYPE html>
<html>
<head>
  <title>Product Data Debug</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .product {
      background: #2d2d2d;
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
      border-left: 4px solid #E83A2E;
    }
    .field {
      margin: 5px 0;
    }
    .label {
      color: #4EC9B0;
      font-weight: bold;
    }
    .value {
      color: #CE9178;
    }
    .error {
      color: #f48771;
      background: #5a1d1d;
      padding: 10px;
      border-radius: 5px;
    }
    button {
      background: #E83A2E;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px 5px 10px 0;
    }
    button:hover {
      background: #d4342a;
    }
  </style>
</head>
<body>
  <h1>GO7 Product Data Debugger</h1>
  <p>This will fetch raw product data from Firestore and show you exactly what fields exist.</p>
  
  <div>
    <input type="text" id="vendorId" placeholder="Enter Vendor ID" style="width: 300px; padding: 10px; background: #2d2d2d; color: white; border: 1px solid #444; border-radius: 5px;">
    <button onclick="fetchProducts()">Fetch Products</button>
    <button onclick="fetchGlobalProducts()">Fetch Global Products</button>
  </div>
  
  <div id="output"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs, query, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // Import Firebase config from your app
    const firebaseConfig = {
      apiKey: "AIzaSyBOqK7vVNmNf0mh9CkEEzMQV7ktETQ-4q8",
      authDomain: "go7-b69ab.firebaseapp.com",
      projectId: "go7-b69ab",
      storageBucket: "go7-b69ab.appspot.com",
      messagingSenderId: "925656316430",
      appId: "1:925656316430:web:8a2e2e2e2e2e2e2e2e2e2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.fetchProducts = async function() {
      const vendorId = document.getElementById('vendorId').value.trim();
      const output = document.getElementById('output');
      
      if (!vendorId) {
        output.innerHTML = '<div class="error">Please enter a Vendor ID</div>';
        return;
      }

      output.innerHTML = '<p>Loading...</p>';

      try {
        const productsRef = collection(db, `vendors/${vendorId}/products`);
        const q = query(productsRef, limit(10));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          output.innerHTML = '<div class="error">No products found for this vendor</div>';
          return;
        }

        let html = `<h2>Found ${snapshot.size} products</h2>`;
        
        snapshot.docs.forEach((doc, index) => {
          const data = doc.data();
          html += `
            <div class="product">
              <h3>Product ${index + 1}: ${doc.id}</h3>
              ${Object.entries(data).map(([key, value]) => `
                <div class="field">
                  <span class="label">${key}:</span> 
                  <span class="value">${typeof value === 'object' ? JSON.stringify(value) : value}</span>
                  <span style="color: #858585; margin-left: 10px;">(${typeof value})</span>
                </div>
              `).join('')}
              
              <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">
                <strong style="color: #4FC3F7;">Price Analysis:</strong><br>
                Raw price: <code>${data.price}</code><br>
                Type: <code>${typeof data.price}</code><br>
                Is number: <code>${typeof data.price === 'number'}</code><br>
                Is NaN: <code>${isNaN(data.price)}</code><br>
                Parsed: <code>${parseFloat(String(data.price))}</code><br>
                Formatted: <code>₦${typeof data.price === 'number' && !isNaN(data.price) ? data.price.toLocaleString() : 'NaN'}</code>
              </div>
            </div>
          `;
        });

        output.innerHTML = html;

      } catch (error) {
        output.innerHTML = `<div class="error">Error: ${error.message}</div>`;
        console.error(error);
      }
    };

    window.fetchGlobalProducts = async function() {
      const output = document.getElementById('output');
      output.innerHTML = '<p>Loading global products...</p>';

      try {
        const productsRef = collection(db, 'products');
        const q = query(productsRef, limit(10));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          output.innerHTML = '<div class="error">No products in global collection</div>';
          return;
        }

        let html = `<h2>Found ${snapshot.size} global products</h2>`;
        
        snapshot.docs.forEach((doc, index) => {
          const data = doc.data();
          html += `
            <div class="product">
              <h3>Product ${index + 1}: ${doc.id}</h3>
              ${Object.entries(data).map(([key, value]) => `
                <div class="field">
                  <span class="label">${key}:</span> 
                  <span class="value">${typeof value === 'object' ? JSON.stringify(value) : value}</span>
                  <span style="color: #858585; margin-left: 10px;">(${typeof value})</span>
                </div>
              `).join('')}
              
              <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">
                <strong style="color: #4FC3F7;">Price Analysis:</strong><br>
                Raw price: <code>${data.price}</code><br>
                Type: <code>${typeof data.price}</code><br>
                Parsed: <code>${parseFloat(String(data.price))}</code>
              </div>
            </div>
          `;
        });

        output.innerHTML = html;

      } catch (error) {
        output.innerHTML = `<div class="error">Error: ${error.message}</div>`;
        console.error(error);
      }
    };
  </script>
</body>
</html>
