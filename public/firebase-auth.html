<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth - Create User</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #666;
            font-size: 16px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .status-label {
            color: #666;
        }
        
        .status-value {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Firebase Auth</h1>
        <p class="subtitle">Create account or sign in to GO7</p>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('signup')">Sign Up</button>
            <button class="tab" onclick="switchTab('login')">Sign In</button>
        </div>
        
        <div id="message"></div>
        
        <!-- Sign Up Tab -->
        <div id="signup-tab" class="tab-content active">
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Min 6 characters" required>
                </div>
                
                <div class="form-group">
                    <label for="signup-name">Display Name (Optional)</label>
                    <input type="text" id="signup-name" placeholder="Your Name">
                </div>
                
                <button type="submit" id="signup-btn">Create Account</button>
            </form>
        </div>
        
        <!-- Login Tab -->
        <div id="login-tab" class="tab-content">
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter password" required>
                </div>
                
                <button type="submit" id="login-btn">Sign In</button>
            </form>
        </div>
        
        <div id="user-status" class="status" style="display: none;">
            <div class="status-item">
                <span class="status-label">Status:</span>
                <span class="status-value" id="auth-status">Not logged in</span>
            </div>
            <div class="status-item">
                <span class="status-label">Email:</span>
                <span class="status-value" id="user-email">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">User ID:</span>
                <span class="status-value" id="user-id" style="font-size: 11px;">-</span>
            </div>
            <button onclick="signOut()" style="margin-top: 10px; background: #dc3545;">Sign Out</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword,
            signOut as firebaseSignOut,
            updateProfile,
            onAuthStateChanged 
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // Firebase config from environment variables
        const firebaseConfig = {
            apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
            authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
            projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
            storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
            messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
            appId: import.meta.env.VITE_FIREBASE_APP_ID,
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Tab switching
        window.switchTab = (tab) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');
            clearMessage();
        };

        // Show message
        function showMessage(text, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
        }

        function clearMessage() {
            document.getElementById('message').style.display = 'none';
        }

        // Update user status display
        function updateUserStatus(user) {
            const statusDiv = document.getElementById('user-status');
            
            if (user) {
                document.getElementById('auth-status').textContent = '✅ Logged In';
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('user-id').textContent = user.uid;
                statusDiv.style.display = 'block';
                
                showMessage(`Welcome ${user.displayName || user.email}! You can now use the GO7 app.`, 'success');
            } else {
                document.getElementById('auth-status').textContent = '❌ Not logged in';
                document.getElementById('user-email').textContent = '-';
                document.getElementById('user-id').textContent = '-';
                statusDiv.style.display = 'none';
            }
        }

        // Listen for auth state changes
        onAuthStateChanged(auth, (user) => {
            updateUserStatus(user);
        });

        // Sign Up
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const displayName = document.getElementById('signup-name').value;
            const btn = document.getElementById('signup-btn');
            
            btn.disabled = true;
            btn.textContent = 'Creating account...';
            clearMessage();
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                
                // Update display name if provided
                if (displayName) {
                    await updateProfile(userCredential.user, {
                        displayName: displayName
                    });
                }
                
                showMessage('✅ Account created successfully!', 'success');
                document.getElementById('signup-form').reset();
                
                // Switch to login tab after 2 seconds
                setTimeout(() => {
                    switchTab('login');
                }, 2000);
                
            } catch (error) {
                console.error('Sign up error:', error);
                
                let errorMessage = 'Failed to create account. ';
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage += 'This email is already registered.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage += 'Password should be at least 6 characters.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage += 'Invalid email address.';
                } else {
                    errorMessage += error.message;
                }
                
                showMessage(errorMessage, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });

        // Sign In
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            clearMessage();
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMessage('✅ Signed in successfully!', 'success');
                document.getElementById('login-form').reset();
                
            } catch (error) {
                console.error('Sign in error:', error);
                
                let errorMessage = 'Failed to sign in. ';
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMessage += 'Invalid email or password.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage += 'Too many failed attempts. Try again later.';
                } else {
                    errorMessage += error.message;
                }
                
                showMessage(errorMessage, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        // Sign Out
        window.signOut = async () => {
            try {
                await firebaseSignOut(auth);
                showMessage('Signed out successfully', 'info');
                clearMessage();
            } catch (error) {
                console.error('Sign out error:', error);
                showMessage('Failed to sign out: ' + error.message, 'error');
            }
        };
    </script>
</body>
</html>
