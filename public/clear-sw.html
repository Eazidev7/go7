<!DOCTYPE html>
<html>
<head>
    <title>Clearing Service Worker...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .log {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Clearing Service Workers & Cache</h1>
        <div class="spinner"></div>
        <div class="log" id="log">Please wait...</div>
    </div>

    <script>
        const log = document.getElementById('log');
        
        async function clearEverything() {
            try {
                log.textContent = 'Unregistering service workers...';
                
                // Unregister all service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log('✅ Unregistered:', registration.scope);
                    }
                    log.textContent = `Unregistered ${registrations.length} service worker(s)`;
                }
                
                // Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (let name of cacheNames) {
                        await caches.delete(name);
                        console.log('✅ Deleted cache:', name);
                    }
                    log.textContent = `Cleared ${cacheNames.length} cache(s)`;
                }
                
                // Clear localStorage
                localStorage.clear();
                
                // Clear sessionStorage
                sessionStorage.clear();
                
                log.textContent = '✅ All cleared! Redirecting...';
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
                
            } catch (error) {
                log.textContent = '❌ Error: ' + error.message;
                console.error(error);
            }
        }
        
        clearEverything();
    </script>
</body>
</html>
