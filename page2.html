  <!-- Fix Hostinger nested paths: strip trailing slash before React Router loads -->
  <script>
    (function () {
      var p = location.pathname;
      if (p.length > 1 && p.endsWith('/')) {
        history.replaceState(null, '', p.slice(0, -1) + location.search + location.hash);
      }
    })();
  </script>

  <!-- Bootstrap: path fixes, lite auth pages -->
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, '') || '/';
      var pathLower = path.toLowerCase();

      window.__GO7_LITE_PAGE__ = /^\/(vendor|agent|admin|rider)\/(login|register|signup)/.test(pathLower)
        || pathLower === '/admin/setup';

      window.initAutocomplete = function () {
        window.googleMapsApiReady = true;
        if (window.initGoogleMapsInReact) window.initGoogleMapsInReact();
        try {
          window.dispatchEvent(new Event('go7-maps-ready'));
        } catch (e) { /* ignore */ }
      };
      window.googleMapsApiFailed = false;

      if (!window.__GO7_LITE_PAGE__) {
        window.addEventListener('error', function (e) {
          if (e.target && e.target.src && e.target.src.indexOf('maps.googleapis.com') !== -1) {
            window.googleMapsApiFailed = true;
          }
        }, true);

        function loadMapLibs() {
          if (window.__go7MapLibsLoaded) return;
          window.__go7MapLibsLoaded = true;

          var maps = document.createElement('script');
          maps.async = true;
          maps.defer = true;
          maps.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyC8-83X6nzox-y2rsX6Rukkj48hYs1HVt0&libraries=places&loading=async&callback=initAutocomplete';
          maps.onerror = function () { window.googleMapsApiFailed = true; };
          document.head.appendChild(maps);

          var leafletCss = document.createElement('link');
          leafletCss.rel = 'stylesheet';
          leafletCss.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
          leafletCss.crossOrigin = 'anonymous';
          document.head.appendChild(leafletCss);

          var leafletJs = document.createElement('script');
          leafletJs.async = true;
          leafletJs.defer = true;
          leafletJs.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
          leafletJs.crossOrigin = 'anonymous';
          document.head.appendChild(leafletJs);
        }

        // Defer map SDKs until after interactive — home does not need them immediately
        if (document.readyState === 'complete') {
          setTimeout(loadMapLibs, 4000);
        } else {
          window.addEventListener('load', function () { setTimeout(loadMapLibs, 4000); });
        }
      } else {
        window.googleMapsApiFailed = true;
      }
    })();
  </script>

  <script>
    if (!window.__GO7_LITE_PAGE__) {
      (function () {
      function loadPaystack() {
        if (window.PaystackPop) return;
        const script = document.createElement('script');
        script.src = 'https://js.paystack.co/v1/inline.js';
        script.async = true;
        script.onerror = function () {
          window.PaystackPop = class PaystackPopMock {
            newTransaction(config) {
              if (config.onError) config.onError(new Error('Paystack script not loaded'));
            }
          };
        };
        document.head.appendChild(script);
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadPaystack, { timeout: 12000 });
      } else {
        setTimeout(loadPaystack, 8000);
      }
    })();
    }
  </script>
