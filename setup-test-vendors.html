          addDoc(collection(db, 'vendors'), testData),

        output.innerHTML += '<span class="success">✓ SUCCESS! Document created with ID: ' + docRef.id + '\n\n</span>';

          'Delete operation timed out'

    let totalVendorsCreated = 0;
    let totalProductsCreated = 0;
    let totalCategories = new Set();

    // Helper to add delay between operations
    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Helper to add timeout to promises
    const withTimeout = (promise, ms, errorMsg) => {
      return Promise.race([
        promise,
        new Promise((_, reject) => 
          setTimeout(() => reject(new Error(errorMsg + ' (timeout)')), ms)
        )
      ]);
    };

    // Test Firebase connection
    async function testConnection() {
      try {
        const testRef = collection(db, 'vendors');
        await getDocs(query(testRef, where('__name__', '==', 'nonexistent')));
        return true;
      } catch (error) {
        console.error('Connection test failed:', error);
        return false;
      }
    }

    window.setupAllVendors = async function() {
      const output = document.getElementById('output');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const stats = document.getElementById('stats');
      
      output.innerHTML = '<span class="info">🚀 Starting automated setup...\n\n</span>';
      progressContainer.style.display = 'block';
      stats.style.display = 'grid';
      
      // Test connection first
      output.innerHTML += '<span class="info">🔍 Testing Firebase connection...\n</span>';
      const connected = await testConnection();
      if (!connected) {
        output.innerHTML += '<span class="error">❌ Firebase connection failed! Check your internet/Firebase config.\n</span>';
        return;
      }
      output.innerHTML += '<span class="success">✓ Firebase connected!\n\n</span>';
      
      totalVendorsCreated = 0;
      totalProductsCreated = 0;
      totalCategories.clear();
      
      try {
        const totalSteps = testVendors.length;
        
        for (let i = 0; i < testVendors.length; i++) {
          const vendor = testVendors[i];
          const progress = ((i + 1) / totalSteps) * 100;
          progressBar.style.width = progress + '%';
          
          output.innerHTML += `<span class="info">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n</span>`;
          output.innerHTML += `<span class="info">📦 Creating: ${vendor.businessName}\n</span>`;
          
          try {
            // Create vendor
            const products = [...vendor.products]; // Clone products array
            const vendorData = { ...vendor }; // Clone vendor object
            delete vendorData.products;
            
            // Prepare vendor data with proper timestamp
            vendorData.createdAt = new Date().toISOString();
            vendorData.updatedAt = new Date().toISOString();
            
            // Log vendor data for debugging
            console.log('Creating vendor:', vendorData.businessName, vendorData);
            
            output.innerHTML += `<span class="info">  → Creating vendor document...\n</span>`;
            
            try {
              // Add vendor with 15 second timeout
              const vendorRef = await withTimeout(
                addDoc(collection(db, 'vendors'), vendorData),
                15000,
                'Vendor creation timed out'
              );
              
              output.innerHTML += `<span class="success">  ✓ Vendor created (ID: ${vendorRef.id})\n</span>`;
              totalVendorsCreated++;
              
              // Update stats immediately
              document.getElementById('vendorCount').textContent = totalVendorsCreated;
              
            } catch (vendorError) {
              output.innerHTML += `<span class="error">  ✗ Vendor creation failed: ${vendorError.message}\n</span>`;
              console.error('Vendor error details:', vendorError);
              
              // Skip products if vendor creation failed
              throw vendorError;
            }
            
            // Small delay to prevent rate limiting
            await delay(300);
            
            // Add all products for this vendor
            output.innerHTML += `<span class="info">  → Adding ${products.length} products...\n</span>`;
            
            for (let j = 0; j < products.length; j++) {
              const product = products[j];
              
              try {
                const productData = {
                  name: product.name,
                  description: product.description,
                  basePrice: product.basePrice,
                  price: product.basePrice,
                  category: product.category,
                  imageUrl: product.image,
                  measurementType: "portion",
                  preparationTime: product.prepTime || 20,
                  tags: [],
                  vendorId: vendorRef.id,
                  active: true,
                  isActive: true,
                  available: true,
                  isAvailable: true,
                  createdAt: new Date(),
                  updatedAt: new Date()
                };
                
                await addDoc(collection(db, 'vendors', vendorRef.id, 'products'), productData);
                totalProductsCreated++;
                totalCategories.add(product.category);
                
                output.innerHTML += `<span class="success">    ✓ ${product.name} (${j + 1}/${products.length})\n</span>`;
                
                // Update stats in real-time
                document.getElementById('vendorCount').textContent = totalVendorsCreated;
                document.getElementById('productCount').textContent = totalProductsCreated;
                document.getElementById('categoryCount').textContent = totalCategories.size;
                
                // Small delay between products to prevent rate limiting
                if ((j + 1) % 3 === 0) {
                  await delay(200);
                }
                
              } catch (productError) {
                output.innerHTML += `<span class="error">    ✗ Failed to add ${product.name}: ${productError.message}\n</span>`;
                console.error('Product creation error:', productError);
              }
            }
            
            output.innerHTML += `<span class="success">  ✓ Added ${products.length} products\n</span>`;
            
          } catch (error) {
            output.innerHTML += `<span class="error">✗ Vendor Error: ${error.message}\n</span>`;
            output.innerHTML += `<span class="error">   Stack: ${error.stack}\n</span>`;
            console.error('Vendor creation error:', error);
          }
          
          // Delay between vendors
          await delay(500);
        }
        
        progressBar.style.width = '100%';
        
        output.innerHTML += `\n<span class="info">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n</span>`;
        output.innerHTML += `<span class="success">🎉 SETUP COMPLETE!\n\n</span>`;
        output.innerHTML += `<span class="success">✓ ${totalVendorsCreated} vendors created\n</span>`;
        output.innerHTML += `<span class="success">✓ ${totalProductsCreated} products added\n</span>`;
        output.innerHTML += `<span class="success">✓ ${totalCategories.size} product categories\n\n</span>`;
        output.innerHTML += `<span class="info">🚀 Ready to test! Open http://localhost:3000\n</span>`;
        
      } catch (error) {
        output.innerHTML += `<span class="error">\n❌ Setup failed: ${error.message}\n</span>`;
        console.error('Setup error:', error);
      }
    };

    window.clearTestData = async function() {
      if (!confirm('⚠️ This will delete ALL test vendors and their products. Continue?')) {
        return;
      }
      
      const output = document.getElementById('output');
      output.innerHTML = '<span class="warning">🗑️ Clearing test data...\n\n</span>';
      
      try {
        const vendorsSnapshot = await getDocs(collection(db, 'vendors'));
        let deletedVendors = 0;
        let deletedProducts = 0;
        
        for (const vendorDoc of vendorsSnapshot.docs) {
          const vendorData = vendorDoc.data();
          const vendorName = vendorData.businessName || vendorData.name;
          
          // Only delete test vendors (those created by this script)
          if (vendorName && (
            vendorName.includes('Pizza Paradise') ||
            vendorName.includes('Mama\'s Kitchen') ||
            vendorName.includes('HealthPlus') ||
            vendorName.includes('Fresh Market Hub') ||
            vendorName.includes('Burger Bros')
          )) {
            output.innerHTML += `<span class="warning">Deleting: ${vendorName}\n</span>`;
            
            // Delete products first
            const productsSnapshot = await getDocs(collection(db, 'vendors', vendorDoc.id, 'products'));
            for (const productDoc of productsSnapshot.docs) {
              await deleteDoc(doc(db, 'vendors', vendorDoc.id, 'products', productDoc.id));
              deletedProducts++;
            }
            
            // Delete vendor
            await deleteDoc(doc(db, 'vendors', vendorDoc.id));
            deletedVendors++;
          }
        }
        
        output.innerHTML += `\n<span class="success">✓ Deleted ${deletedVendors} vendors\n</span>`;
        output.innerHTML += `<span class="success">✓ Deleted ${deletedProducts} products\n\n</span>`;
        output.innerHTML += `<span class="info">✓ Database cleaned!\n</span>`;
        
        // Reset stats
        document.getElementById('vendorCount').textContent = '0';
        document.getElementById('productCount').textContent = '0';
        document.getElementById('categoryCount').textContent = '0';
        
      } catch (error) {
        output.innerHTML += `<span class="error">\n❌ Clear failed: ${error.message}\n</span>`;
        console.error('Clear error:', error);
      }
    };
  </script>
</body>
