  <!-- Bootstrap: path fixes, lite auth pages -->
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, '') || '/';
      var pathLower = path.toLowerCase();

      // Customer SPA must never own vendor auth URLs — hard-switch to vendor.html
      if (/^\/vendor\/(login|register)$/i.test(pathLower) && !window.__GO7_VENDOR_ENTRY__) {
        location.replace('/vendor.html');
        return;
      }

      window.__GO7_LITE_PAGE__ = /^\/(vendor|agent|admin|rider)\/(login|register|signup)/.test(pathLower)
        || pathLower === '/admin/setup';

      window.initAutocomplete = function () {
        window.googleMapsApiReady = true;
        if (window.initGoogleMapsInReact) window.initGoogleMapsInReact();
        try {
          window.dispatchEvent(new Event('go7-maps-ready'));
        } catch (e) { /* ignore */ }
      };
      window.googleMapsApiFailed = false;

      if (!window.__GO7_LITE_PAGE__) {
        window.addEventListener('error', function (e) {
          if (e.target && e.target.src && e.target.src.indexOf('maps.googleapis.com') !== -1) {
            window.googleMapsApiFailed = true;
          }
        }, true);

        function loadMapLibs(force) {
          if (window.google && window.google.maps) {
            window.googleMapsApiFailed = false;
            try { window.dispatchEvent(new Event('go7-maps-ready')); } catch (e) { /* ignore */ }
            return;
          }
          // Already injecting — Track may call ensure early; don't double-append.
          var existing = document.querySelector('script[src*="maps.googleapis.com/maps/api/js"]');
          if (existing && !window.googleMapsApiFailed) return;
          if (window.__go7MapLibsLoaded && !force && !window.googleMapsApiFailed) return;
          window.__go7MapLibsLoaded = true;
          window.googleMapsApiFailed = false;

          var maps = document.createElement('script');
          maps.async = true;
          maps.defer = true;
          maps.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyDM30MGmm0vY8TQ-XfogBCdNelh1Fyru9E&libraries=places&loading=async&callback=initAutocomplete';
          maps.onerror = function () {
            window.googleMapsApiFailed = true;
            window.__go7MapLibsLoaded = false;
          };
          document.head.appendChild(maps);

          if (!document.querySelector('link[href*="leaflet@1.9.4"]')) {
            var leafletCss = document.createElement('link');
            leafletCss.rel = 'stylesheet';
            leafletCss.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
            leafletCss.crossOrigin = 'anonymous';
            document.head.appendChild(leafletCss);
          }

          if (!document.querySelector('script[src*="leaflet@1.9.4/dist/leaflet.js"]')) {
            var leafletJs = document.createElement('script');
            leafletJs.async = true;
            leafletJs.defer = true;
            leafletJs.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
            leafletJs.crossOrigin = 'anonymous';
            document.head.appendChild(leafletJs);
          }
        }

        // Track / Book Delivery can request maps immediately (avoids false "no network")
        window.__GO7_ENSURE_MAPS__ = function () { loadMapLibs(true); };

        // Map screens call __GO7_ENSURE_MAPS__ when needed.
        // Do not bill/load Google Maps on Home, Profile, Orders, or other non-map pages.
      } else {
        window.googleMapsApiFailed = true;
      }
    })();
  </script>
