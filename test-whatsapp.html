<!DOCTYPE html>
<html>
<head>
    <title>Test WhatsApp - GO7</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0052a3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>🧪 Test WhatsApp Integration</h1>
    
    <div class="form-group">
        <label>Phone Number (e.g., 08012345678):</label>
        <input type="tel" id="phone" placeholder="08012345678">
    </div>
    
    <div class="form-group">
        <label>Customer Name:</label>
        <input type="text" id="name" placeholder="John Doe">
    </div>
    
    <div class="form-group">
        <label>Order Number:</label>
        <input type="text" id="orderNum" placeholder="GO7123456">
    </div>
    
    <button onclick="testWhatsApp()">📱 Send Test WhatsApp</button>
    
    <div id="result"></div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBWwpDE5bXWCLg-E5PbhrLW9OFaLq-jzqk",
            authDomain: "go7-delivery.firebaseapp.com",
            projectId: "go7-delivery",
            storageBucket: "go7-delivery.firebasestorage.app",
            messagingSenderId: "653805977716",
            appId: "1:653805977716:web:c2db25b52ebb6e4e27e3be",
            measurementId: "G-PDFSCJX7K6"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const functions = firebase.functions();

        async function testWhatsApp() {
            const phone = document.getElementById('phone').value;
            const name = document.getElementById('name').value;
            const orderNum = document.getElementById('orderNum').value;
            const resultDiv = document.getElementById('result');

            if (!phone || !name || !orderNum) {
                showResult('Please fill in all fields', false);
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.textContent = '⏳ Sending WhatsApp message...';

            try {
                const testFunction = functions.httpsCallable('testInfobipWhatsApp');
                const result = await testFunction({
                    phoneNumber: phone,
                    customerName: name,
                    orderNumber: orderNum
                });

                console.log('Success:', result.data);
                showResult(`✅ WhatsApp sent successfully!\n\nFull Response:\n${JSON.stringify(result.data, null, 2)}\n\nCheck ${phone} for the message.`, true);
            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ Error: ${error.message}\n\n${JSON.stringify(error.details || '', null, 2)}`, false);
            }
        }

        function showResult(message, success) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = success ? 'success' : 'error';
            resultDiv.textContent = message;
        }
    </script>
</body>
</html>
