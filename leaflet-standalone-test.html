<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaflet Map Standalone Test</title>
  
  <!-- Import Leaflet CSS and JS directly -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: #E53935;
      text-align: center;
    }
    
    p {
      color: #555;
      line-height: 1.6;
    }
    
    .map-wrap {
      position: relative;
      width: 100%;
      height: auto;
      min-height: 300px;
      margin: 30px 0;
    }
    
    .map-inner {
      width: 100%;
      height: 420px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 1px solid #ddd;
    }
    
    @media (max-width: 640px) {
      .map-inner {
        height: 260px;
      }
    }
    
    button {
      background-color: #E53935;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      margin: 10px 5px;
    }
    
    button:hover {
      background-color: #D32F2F;
    }
    
    .control-panel {
      margin: 20px 0;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 8px;
    }
    
    .selected-area-info {
      margin-top: 10px;
      padding: 10px;
      background-color: #e8f5e9;
      border-radius: 4px;
      font-weight: 500;
    }
    
    .log-panel {
      margin-top: 20px;
      padding: 15px;
      background-color: #f0f0f0;
      border-radius: 8px;
      font-family: monospace;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .log-entry {
      margin: 5px 0;
      font-size: 14px;
    }
    
    .log-entry.success {
      color: green;
    }
    
    .log-entry.error {
      color: red;
    }
    
    .log-entry.info {
      color: blue;
    }
  </style>
</head>
<body>
  <h1>Leaflet Map Standalone Test</h1>
  
  <p>This is a standalone test page for Leaflet map functionality. Use the controls below to test different aspects of the map.</p>
  
  <div class="control-panel">
    <button id="invalidateSize">Invalidate Size</button>
    <button id="recenterMap">Recenter Map</button>
    <button id="toggleMarkers">Toggle Markers</button>
    <button id="switchTileLayer">Switch Tile Layer</button>
  </div>
  
  <div class="map-wrap">
    <div id="test-map" class="map-inner"></div>
    <div id="selected-area" class="selected-area-info" style="display: none;"></div>
  </div>
  
  <div class="log-panel" id="log-panel"></div>
  
  <script>
    // ABEOKUTA_AREAS data
    const ABEOKUTA_AREAS = [
      { name: "Kuto", coords: [7.1410, 3.3540], color: "green", category: "residential" },
      { name: "Panseke", coords: [7.1450, 3.3430], color: "red", category: "popular" },
      { name: "Ibara", coords: [7.1500, 3.3470], color: "red", category: "popular" },
      { name: "Oke-Ilewo", coords: [7.1600, 3.3490], color: "red", category: "popular" },
      { name: "Ijemo", coords: [7.1600, 3.3450], color: "green", category: "residential" },
      { name: "Totoro", coords: [7.1620, 3.3330], color: "orange", category: "busy" },
      { name: "Lafenwa", coords: [7.1720, 3.3490], color: "orange", category: "busy" },
      { name: "Omida", coords: [7.1590, 3.3550], color: "green", category: "residential" },
      { name: "Adatan", coords: [7.1430, 3.3650], color: "pink", category: "market" },
      { name: "Kemta", coords: [7.1300, 3.3550], color: "green", category: "residential" },
      { name: "Asero", coords: [7.1670, 3.3680], color: "green", category: "residential" },
      { name: "Sapon", coords: [7.1530, 3.3530], color: "pink", category: "market" },
      { name: "Ake", coords: [7.1510, 3.3600], color: "pink", category: "market" },
      { name: "Itoku", coords: [7.1450, 3.3580], color: "pink", category: "market" },
      { name: "Isabo", coords: [7.1470, 3.3480], color: "green", category: "residential" },
      { name: "Idi-Aba", coords: [7.1460, 3.3300], color: "green", category: "residential" },
      { name: "Quarry Rd", coords: [7.1680, 3.3520], color: "orange", category: "busy" },
      { name: "Ita-Eko", coords: [7.1610, 3.3560], color: "pink", category: "market" },
      { name: "Olomore", coords: [7.1970, 3.3470], color: "green", category: "residential" },
      { name: "Obantoko", coords: [7.1170, 3.3680], color: "green", category: "residential" },
      { name: "FUNAAB", coords: [7.2460, 3.4390], color: "blue", category: "education" },
      { name: "Camp (FUNAAB)", coords: [7.2440, 3.4440], color: "blue", category: "education" }
    ];
    
    // Available tile URLs for fallback
    const TILE_URLS = [
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',
      'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png'
    ];
    
    // Log function
    function log(message, type = 'info') {
      const logPanel = document.getElementById('log-panel');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = message;
      logPanel.appendChild(entry);
      logPanel.scrollTop = logPanel.scrollHeight;
    }
    
    // Variables to store map objects
    let map = null;
    let markers = [];
    let currentTileLayer = null;
    let currentTileIndex = 0;
    let markersVisible = true;
    
    // Initialize map
    function initMap() {
      try {
        // Check if Leaflet is loaded
        if (typeof L === 'undefined') {
          log('Leaflet library not loaded!', 'error');
          return;
        }
        
        log('Initializing map...', 'info');
        
        // Create map
        map = L.map('test-map', {
          center: [7.1475, 3.3619], // Abeokuta
          zoom: 12.5,
          zoomControl: true,
          attributionControl: true
        });
        
        log('Map initialized successfully', 'success');
        
        // Add tile layer
        currentTileLayer = L.tileLayer(TILE_URLS[currentTileIndex], {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        log(`Added tile layer: ${TILE_URLS[currentTileIndex]}`, 'success');
        
        // Add markers
        addMarkers();
        
        // Ensure map is sized correctly
        setTimeout(() => {
          map.invalidateSize();
          log('Map size invalidated', 'success');
        }, 100);
      } catch (error) {
        log(`Error initializing map: ${error.message}`, 'error');
        console.error(error);
      }
    }
    
    // Add markers for Abeokuta areas
    function addMarkers() {
      // Clear existing markers
      markers.forEach(marker => marker.remove());
      markers = [];
      
      ABEOKUTA_AREAS.forEach(area => {
        const marker = L.marker(area.coords, {
          title: area.name,
          alt: `${area.name} area marker`
        });
        
        // Add popup
        marker.bindPopup(`<b>${area.name}</b><br>${area.category}`);
        
        // Add click handler
        marker.on('click', () => {
          const selectedArea = document.getElementById('selected-area');
          selectedArea.textContent = `Selected: ${area.name}`;
          selectedArea.style.display = 'block';
          log(`Selected area: ${area.name}`, 'info');
        });
        
        marker.addTo(map);
        markers.push(marker);
      });
      
      log(`Added ${markers.length} markers`, 'success');
    }
    
    // Button event handlers
    document.getElementById('invalidateSize').addEventListener('click', () => {
      if (map) {
        map.invalidateSize();
        log('Map size manually invalidated', 'success');
      }
    });
    
    document.getElementById('recenterMap').addEventListener('click', () => {
      if (map) {
        map.setView([7.1475, 3.3619], 12.5);
        log('Map recentered to Abeokuta', 'success');
      }
    });
    
    document.getElementById('toggleMarkers').addEventListener('click', () => {
      if (markers.length === 0) return;
      
      markersVisible = !markersVisible;
      
      markers.forEach(marker => {
        if (markersVisible) {
          marker.addTo(map);
        } else {
          marker.remove();
        }
      });
      
      log(`Markers ${markersVisible ? 'shown' : 'hidden'}`, 'info');
    });
    
    document.getElementById('switchTileLayer').addEventListener('click', () => {
      if (!map || !currentTileLayer) return;
      
      // Remove current tile layer
      map.removeLayer(currentTileLayer);
      
      // Switch to next tile layer
      currentTileIndex = (currentTileIndex + 1) % TILE_URLS.length;
      
      // Add new tile layer
      currentTileLayer = L.tileLayer(TILE_URLS[currentTileIndex], {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      
      log(`Switched to tile layer: ${TILE_URLS[currentTileIndex]}`, 'success');
    });
    
    // Initialize map when page loads
    window.addEventListener('load', initMap);
  </script>
</body>
</html>
