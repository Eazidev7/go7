<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chowdeck-Style Hero Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animations for the bike */
        .bike-animation {
            animation: moveBike 12s linear infinite;
        }

        @keyframes moveBike {
            0% {
                transform: translateX(-100px) translateY(0px);
            }
            25% {
                transform: translateX(25vw) translateY(-8px);
            }
            50% {
                transform: translateX(50vw) translateY(8px);
            }
            75% {
                transform: translateX(75vw) translateY(-8px);
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(0px);
            }
        }

        /* Road styling */
        .road-dashes {
            animation: dashMove 3s linear infinite;
        }

        @keyframes dashMove {
            0% {
                stroke-dashoffset: 0;
            }
            100% {
                stroke-dashoffset: 60;
            }
        }

        /* Custom cream background */
        .cream-bg {
            background-color: #fdf5f0;
        }
    </style>
</head>
<body class="font-sans">
    <!-- Hero Section -->
    <section class="cream-bg min-h-screen relative overflow-hidden">
        <!-- Navigation -->
        <nav class="flex items-center justify-between px-6 md:px-12 py-4">
            <!-- Logo -->
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 bg-red-500 rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold text-lg">G7</span>
                </div>
                <span class="text-gray-800 font-bold text-xl">Go7</span>
            </div>

            <!-- Navigation Links -->
            <div class="hidden md:flex items-center space-x-8">
                <a href="#" class="text-gray-700 hover:text-red-500 font-medium">Home</a>
                <a href="#" class="text-gray-700 hover:text-red-500 font-medium">Services</a>
                <a href="#" class="text-gray-700 hover:text-red-500 font-medium">Track Order</a>
                <a href="#" class="text-gray-700 hover:text-red-500 font-medium">Contact</a>
            </div>

            <!-- CTA Button -->
            <button class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition-colors font-medium">
                Order Now
            </button>
        </nav>

        <!-- Hero Content -->
        <div class="flex flex-col lg:flex-row items-center justify-between px-6 md:px-12 py-12 md:py-20">
            <!-- Left Content -->
            <div class="flex-1 max-w-2xl mb-12 lg:mb-0">
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-gray-900 leading-tight mb-6">
                    From Meals to Parcels,
                    <span class="text-red-500">Go7 Delivers Fast</span>
                </h1>
                
                <p class="text-lg md:text-xl text-gray-600 leading-relaxed mb-8 max-w-lg">
                    Fresh meals, groceries, and packages delivered right to your doorstep in minutes.
                </p>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-4">
                    <button class="px-8 py-4 bg-red-500 text-white font-bold text-lg rounded-lg hover:bg-red-600 transition-colors shadow-lg">
                        🛵 Book Delivery
                    </button>
                    <button class="px-8 py-4 bg-transparent border-2 border-red-500 text-red-500 font-bold text-lg rounded-lg hover:bg-red-500 hover:text-white transition-colors">
                        📦 Track Package
                    </button>
                </div>

                <!-- Features List -->
                <div class="flex flex-wrap items-center gap-6 mt-8 text-sm text-gray-600">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                        <span>Fast Delivery</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
                        <span>Real-time Tracking</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-yellow-500 rounded-full"></div>
                        <span>24/7 Support</span>
                    </div>
                </div>
            </div>

            <!-- Right Content - Illustration -->
            <div class="flex-1 flex items-center justify-center relative">
                <!-- Background decorations -->
                <div class="absolute inset-0 opacity-20">
                    <div class="absolute top-10 left-10 w-4 h-4 bg-red-400 rounded-full animate-bounce"></div>
                    <div class="absolute top-1/3 right-1/4 w-3 h-3 bg-blue-400 rounded-full animate-bounce" style="animation-delay: 0.5s;"></div>
                    <div class="absolute bottom-1/3 left-1/3 w-5 h-5 bg-yellow-400 rounded-full animate-bounce" style="animation-delay: 1s;"></div>
                </div>

                <!-- Main delivery illustration -->
                <div class="relative z-10">
                    <div class="w-80 h-80 bg-gradient-to-br from-red-100 to-orange-100 rounded-full flex items-center justify-center">
                        <!-- Placeholder for delivery illustration -->
                        <div class="text-8xl">🛵</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Curved Road Section (Accent at bottom) -->
        <div class="absolute bottom-0 w-full h-32">
            <!-- SVG Double Wave Road -->
            <svg
                viewBox="0 0 1200 128"
                className="absolute bottom-0 w-full h-full"
                preserveAspectRatio="none"
            >
                <!-- Road Surface with double wave curve -->
                <path
                    d="M0,80 Q150,40 300,60 T600,64 Q750,44 900,64 T1200,80 L1200,128 L0,128 Z"
                    fill="#555"
                    class="drop-shadow-lg"
                />
                
                <!-- Dashed Center Line with double wave -->
                <path
                    d="M0,80 Q150,40 300,60 T600,64 Q750,44 900,64 T1200,80"
                    stroke="white"
                    stroke-width="3"
                    stroke-dasharray="30,30"
                    fill="none"
                    class="road-dashes"
                />
                
                <!-- Road Edge Lines -->
                <path
                    d="M0,70 Q150,30 300,50 T600,54 Q750,34 900,54 T1200,70"
                    stroke="white"
                    stroke-width="2"
                    fill="none"
                    opacity="0.7"
                />
                <path
                    d="M0,90 Q150,50 300,70 T600,74 Q750,54 900,74 T1200,90"
                    stroke="white"
                    stroke-width="2"
                    fill="none"
                    opacity="0.7"
                />
            </svg>

            <!-- Animated Go7 Bike -->
            <div class="absolute bottom-8 left-0 bike-animation">
                <img 
                    src="/go7-bike.png" 
                    alt="Go7 Delivery Bike" 
                    class="w-16 h-16 object-contain filter drop-shadow-lg"
                    onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMzIiIGZpbGw9IiNFRjQ0NDQiLz4KPHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgZmlsbD0id2hpdGUiIHg9IjEyIiB5PSIxMiI+CjxwYXRoIGQ9Ik0yMCAyQzI5LjM4IDIgMzcgOS42MiAzNyAxOUMzNyAyOC4zOCAyOS4zOCAzNiAyMCAzNkMxMC42MiAzNiAzIDI4LjM4IDMgMTlDMyA5LjYyIDEwLjYyIDIgMjAgMloiLz4KPC9zdmc+Cjwvc3ZnPg=='"
                />
            </div>

            <!-- Small decorative road elements -->
            <div class="absolute bottom-4 left-1/4 w-2 h-2 bg-red-400 rounded-full opacity-60 animate-pulse"></div>
            <div class="absolute bottom-6 right-1/3 w-3 h-3 bg-yellow-400 rounded-full opacity-40 animate-pulse" style="animation-delay: 1.5s;"></div>
        </div>
    </section>
</body>
</html>
