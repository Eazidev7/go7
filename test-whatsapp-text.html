<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WhatsApp Custom Text</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        #response {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        #response.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        #response.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .note {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #856404;
        }
        
        .note strong {
            display: block;
            margin-bottom: 5px;
        }
        
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 WhatsApp Custom Text</h1>
        <p class="subtitle">Send any message within 24-hour window</p>
        
        <div class="note">
            <strong>⚠️ Important:</strong>
            This only works AFTER you've sent a template message (like "order received"). 
            That opens a 24-hour window where you can send any custom text.
        </div>
        
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input 
                type="tel" 
                id="phone" 
                placeholder="08166205600" 
                required
            />
        </div>
        
        <div class="form-group">
            <label for="message">Your Message</label>
            <textarea 
                id="message" 
                placeholder="Rider David is on the way. ETA: 10 minutes"
                required
            ></textarea>
        </div>
        
        <button onclick="sendText()" id="sendBtn">
            Send WhatsApp Text
        </button>
        
        <div id="response"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDVe4upj9TxE6YE0Oq5J8_3wVTOIlK6vw4",
            authDomain: "go7-delivery.firebaseapp.com",
            projectId: "go7-delivery",
            storageBucket: "go7-delivery.firebasestorage.app",
            messagingSenderId: "722285015876",
            appId: "1:722285015876:web:cc3f16636a0c9d06c1f7e6",
            measurementId: "G-Y75FH4H0FZ"
        };

        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app);

        window.sendText = async function() {
            const phone = document.getElementById('phone').value.trim();
            const message = document.getElementById('message').value.trim();
            const btn = document.getElementById('sendBtn');
            const responseDiv = document.getElementById('response');

            if (!phone || !message) {
                alert('Please fill in all fields');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';
            responseDiv.style.display = 'none';

            try {
                const sendWhatsAppText = httpsCallable(functions, 'sendWhatsAppText');
                const result = await sendWhatsAppText({
                    phoneNumber: phone,
                    message: message
                });

                responseDiv.className = 'success';
                responseDiv.style.display = 'block';
                responseDiv.innerHTML = `
                    <strong>✅ Message sent successfully!</strong>
                    <pre>${JSON.stringify(result.data, null, 2)}</pre>
                    <p style="margin-top: 10px;">Check ${phone} for the message</p>
                `;
            } catch (error) {
                responseDiv.className = 'error';
                responseDiv.style.display = 'block';
                responseDiv.innerHTML = `
                    <strong>❌ Error:</strong>
                    <p>${error.message}</p>
                    <pre>${JSON.stringify(error, null, 2)}</pre>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send WhatsApp Text';
            }
        };
    </script>
</body>
</html>
