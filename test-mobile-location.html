<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GO7 Mobile Location Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .status {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(102, 126, 234, 0.2);
            user-select: none;
            -webkit-user-select: none;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        
        button:active {
            transform: scale(0.98);
            background: #f0f0f0;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 14px;
            word-break: break-all;
        }
        
        .success {
            background: rgba(76, 175, 80, 0.2);
        }
        
        .error {
            background: rgba(244, 67, 54, 0.2);
        }
        
        .log {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 GO7 Location Test</h1>
        <p style="margin-bottom: 20px; opacity: 0.9;">Test geolocation on mobile devices</p>
        
        <div class="status">
            <div class="status-item">
                <span>Protocol:</span>
                <span id="protocol">-</span>
            </div>
            <div class="status-item">
                <span>Geolocation:</span>
                <span id="geo-support">-</span>
            </div>
            <div class="status-item">
                <span>Device:</span>
                <span id="device">-</span>
            </div>
        </div>
        
        <button id="get-location" onclick="getLocation()">
            📍 Get My Location
        </button>
        
        <button onclick="clearLogs()" style="background: rgba(255, 255, 255, 0.2); color: white;">
            🗑️ Clear Logs
        </button>
        
        <div id="result"></div>
        
        <div class="log" id="log">
            <div class="log-entry">📝 Logs will appear here...</div>
        </div>
    </div>
    
    <script>
        // Initialize
        document.getElementById('protocol').textContent = window.location.protocol;
        document.getElementById('geo-support').textContent = navigator.geolocation ? '✅ Yes' : '❌ No';
        
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        document.getElementById('device').textContent = isMobile ? '📱 Mobile' : '💻 Desktop';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `<span style="opacity: 0.6;">[${timestamp}]</span> ${message}`;
            logDiv.insertBefore(entry, logDiv.firstChild);
            console.log(message);
        }
        
        function clearLogs() {
            document.getElementById('log').innerHTML = '<div class="log-entry">📝 Logs cleared...</div>';
            document.getElementById('result').innerHTML = '';
        }
        
        async function getLocation() {
            const button = document.getElementById('get-location');
            const resultDiv = document.getElementById('result');
            
            log('🔵 Get Location button clicked');
            
            // Check HTTPS
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                log('❌ Not HTTPS - geolocation may be blocked', 'error');
                resultDiv.innerHTML = '<div class="result error">⚠️ HTTPS required for geolocation on mobile</div>';
                return;
            }
            
            // Check support
            if (!navigator.geolocation) {
                log('❌ Geolocation not supported', 'error');
                resultDiv.innerHTML = '<div class="result error">❌ Geolocation not supported</div>';
                return;
            }
            
            button.disabled = true;
            button.textContent = '⏳ Getting location...';
            resultDiv.innerHTML = '';
            
            log('📍 Requesting geolocation...');
            log('⚙️ Options: { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }');
            
            const options = {
                enableHighAccuracy: true,
                timeout: 30000,
                maximumAge: 0
            };
            
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    log('✅ Location obtained!');
                    log(`📍 Lat: ${position.coords.latitude}, Lng: ${position.coords.longitude}`);
                    log(`📏 Accuracy: ${position.coords.accuracy} meters`);
                    
                    const coords = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        timestamp: new Date(position.timestamp).toLocaleString()
                    };
                    
                    // Try reverse geocoding
                    log('🔍 Attempting reverse geocoding...');
                    try {
                        const response = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${coords.lat}&lon=${coords.lng}`
                        );
                        const data = await response.json();
                        
                        if (data.display_name) {
                            log(`📍 Address: ${data.display_name}`);
                            coords.address = data.display_name;
                        }
                    } catch (geoError) {
                        log('⚠️ Reverse geocoding failed');
                    }
                    
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <strong>✅ Success!</strong><br><br>
                            <strong>Latitude:</strong> ${coords.lat}<br>
                            <strong>Longitude:</strong> ${coords.lng}<br>
                            <strong>Accuracy:</strong> ${coords.accuracy}m<br>
                            <strong>Time:</strong> ${coords.timestamp}<br>
                            ${coords.address ? `<br><strong>Address:</strong><br>${coords.address}` : ''}
                        </div>
                    `;
                    
                    button.disabled = false;
                    button.textContent = '📍 Get My Location';
                },
                (error) => {
                    log(`❌ Geolocation error: ${error.message}`, 'error');
                    log(`❌ Error code: ${error.code}`, 'error');
                    
                    let errorMessage = '';
                    switch(error.code) {
                        case 1:
                            errorMessage = '📍 Permission Denied<br><br>Please enable location in your browser settings and refresh the page.';
                            log('❌ PERMISSION_DENIED', 'error');
                            break;
                        case 2:
                            errorMessage = '📍 Position Unavailable<br><br>Check GPS settings and internet connection.';
                            log('❌ POSITION_UNAVAILABLE', 'error');
                            break;
                        case 3:
                            errorMessage = '⏱️ Timeout<br><br>Request took too long. Try again.';
                            log('❌ TIMEOUT', 'error');
                            break;
                        default:
                            errorMessage = `❌ ${error.message}`;
                    }
                    
                    resultDiv.innerHTML = `<div class="result error">${errorMessage}</div>`;
                    button.disabled = false;
                    button.textContent = '📍 Get My Location';
                },
                options
            );
        }
        
        // Log initial state
        log('✅ Page loaded');
        log(`📱 User Agent: ${navigator.userAgent}`);
        log(`🔒 Protocol: ${window.location.protocol}`);
        log(`🌍 Geolocation: ${navigator.geolocation ? 'Supported' : 'Not supported'}`);
    </script>
</body>
</html>
