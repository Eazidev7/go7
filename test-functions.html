<!DOCTYPE html>
<html>
<head>
    <title>Test Go7 Functions</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyAtYbvOb0xb6yH0KMp05xAHEkePIHrJqJY",
            authDomain: "go7-delivery.firebaseapp.com",
            projectId: "go7-delivery",
            storageBucket: "go7-delivery.appspot.com",
            messagingSenderId: "706871474772",
            appId: "1:706871474772:web:90d32b5a0d4d92b1a92c48"
        };

        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app);
        const auth = getAuth(app);

        window.testCreateVirtualAccount = async function() {
            const output = document.getElementById('output');
            output.innerHTML = '🔄 Testing createUserVirtualAccount...\n';
            
            try {
                const user = auth.currentUser;
                if (!user) {
                    output.innerHTML += '❌ Not logged in! Please log in first.\n';
                    return;
                }

                output.innerHTML += `✅ User authenticated: ${user.uid}\n`;
                output.innerHTML += `📧 Email: ${user.email}\n`;
                output.innerHTML += `📞 Phone: ${user.phoneNumber || 'N/A'}\n\n`;

                const createUserVirtualAccount = httpsCallable(functions, 'createUserVirtualAccount');
                
                output.innerHTML += '📡 Calling function...\n';
                const result = await createUserVirtualAccount({
                    uid: user.uid,
                    email: user.email,
                    phone: user.phoneNumber || '+2348000000000',
                    name: user.displayName || user.email?.split('@')[0] || 'Test User'
                });

                output.innerHTML += '\n✅ Function call successful!\n\n';
                output.innerHTML += '📊 Result:\n';
                output.innerHTML += JSON.stringify(result.data, null, 2);

            } catch (error) {
                output.innerHTML += '\n❌ Error:\n';
                output.innerHTML += error.toString() + '\n';
                output.innerHTML += JSON.stringify(error, null, 2);
            }
        };

        window.checkAuthState = function() {
            const output = document.getElementById('output');
            output.innerHTML = '🔍 Checking auth state...\n';
            
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    output.innerHTML += `✅ Logged in as: ${user.email}\n`;
                    output.innerHTML += `User ID: ${user.uid}\n`;
                    output.innerHTML += `Phone: ${user.phoneNumber || 'N/A'}\n`;
                } else {
                    output.innerHTML += '❌ Not logged in\n';
                    output.innerHTML += 'Please log in via the main app first, then come back here.\n';
                }
            });
        };

        // Auto-check auth on load
        window.addEventListener('load', () => {
            window.checkAuthState();
        });
    </script>
    <style>
        body {
            font-family: monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        button:hover {
            background: #00cc00;
        }
        #output {
            background: #000;
            padding: 20px;
            margin-top: 20px;
            border: 2px solid #00ff00;
            white-space: pre-wrap;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
        }
        h1 {
            color: #00ff00;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🧪 Go7 Functions Test Console</h1>
    
    <div style="text-align: center;">
        <button onclick="checkAuthState()">Check Auth State</button>
        <button onclick="testCreateVirtualAccount()">Test Create Virtual Account</button>
    </div>

    <div id="output">Initializing...</div>

    <div style="margin-top: 20px; padding: 15px; background: #333; border: 1px solid #555;">
        <h3 style="color: #ff9900;">Instructions:</h3>
        <ol style="color: #ccc;">
            <li>First, log in via the main app (http://localhost:9999)</li>
            <li>Then come back to this page</li>
            <li>Click "Check Auth State" to verify you're logged in</li>
            <li>Click "Test Create Virtual Account" to test the function</li>
        </ol>
    </div>
</body>
</html>
